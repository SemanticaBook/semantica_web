
name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_LAYA_MODEL_BASE_URL: ${{ vars.VITE_LAYA_MODEL_BASE_URL || format('https://huggingface.co/{0}/resolve/main/', vars.LAYA_MODEL_REPO || 'SemanticaBook/semantica-laya-multilingual-onnx') }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Verify the public model manifest is available
        shell: bash
        run: |
          primary="${VITE_LAYA_MODEL_BASE_URL%/}/manifest.json"
          backup="https://raw.githubusercontent.com/SemanticaBook/laya-weights/main/manifest.json"
          for manifest_url in "$primary" "$backup"; do
            if status="$(curl --location --silent --show-error --output "${RUNNER_TEMP}/laya-manifest.json" --write-out '%{http_code}' "$manifest_url")"; then
              :
            else
              status=000
            fi
            if [[ "$status" == "200" ]]; then
              echo "Public Laya manifest is reachable: $manifest_url"
              exit 0
            fi
            echo "Model source returned HTTP $status: $manifest_url" >&2
          done
          echo "Neither the primary model host nor the versioned laya-weights backup is publicly readable." >&2
          echo "Publish the backup repository (and, if configured, run 'Build and publish Laya browser model'). The browser cannot use a private token." >&2
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

